name: CI

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js tools/*.mjs tests/*.mjs tests/browser/*.mjs vorlagen/app/js/*.js vorlagen/app/sw.js vorlagen/app/tools/*.mjs vorlagen/app/tests/*.mjs; do node --check "$f"; done
      - name: Tests
        run: node --test tests/*.test.mjs
      # Die Vorlage muss mit dem aktuellen Stand zusammenpassen (z. B. Offline-Liste, Einbindung der Stylesheets)
      - name: Vorlage mit den gemeinsamen Dateien testen
        run: |
          node tools/sync.mjs vorlagen/app
          cd vorlagen/app && node --test tests/*.test.mjs

  # Typprüfung (LEITFADEN.md, Abschn. 9). TypeScript nur hier, die Tests bleiben ohne Abhängigkeiten.
  # Lokal dieselben Pakete in einem Befehl installieren (ein zweites npm install --no-save entfernt die ersten).
  typen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript und ESLint
        run: npm install --no-save typescript@7.0.2 @types/node@22.20.5 playwright@1.52.0 eslint@10.14.0 @eslint/js@10.0.1 globals@17.14.0
      - name: Typen prüfen
        run: npx tsc -p .
      - name: Typen der Vorlage prüfen
        run: |
          node tools/sync.mjs vorlagen/app
          npx tsc -p vorlagen/app

  # ESLint (LEITFADEN.md, Abschn. 9), Regeln in tools/eslint-basis.mjs. Dieselben Pakete wie bei „typen“,
  # damit tsc auch die Konfiguration prüft.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ESLint
        run: npm install --no-save typescript@7.0.2 @types/node@22.20.5 playwright@1.52.0 eslint@10.14.0 @eslint/js@10.0.1 globals@17.14.0
      - name: ESLint
        run: npx eslint .
      - name: ESLint der Vorlage
        run: |
          node tools/sync.mjs vorlagen/app
          cd vorlagen/app && ../../node_modules/.bin/eslint .

  # Browsertests (tests/browser/, Playwright mit Chromium; Entscheidung Thomas, 9.11.2026, #114): Verhalten, das nur
  # im Browser prüfbar ist, z. B. Tooltips bei Maus, Tastatur und Touchscreen (js/help.js).
  # Chromium von Playwright 1.52 nutzt die Bibliotheken des Images Ubuntu 24.04 (ohne apt, #128); ubuntu-latest wechselt auf Ubuntu 26 (wie „pdf“ der Apps)
  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.52.0
          # ohne --with-deps: kein apt (Ausfall der Ubuntu-Paketquellen 11.11.2026, #128); die Bibliotheken sind auf dem Runner
          npx playwright install chromium
      - name: Browsertests
        run: node --test tests/browser/*.test.mjs
